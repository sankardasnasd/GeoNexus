{% extends "admin/admin home copy.html" %}

{% block body %}

<style>

:root {

    --navy: #102a43;
    --navy-light: #1d6fa5;

    --text: #0f172a;
    --muted: #64748b;

    --border: #e2e8f0;

    --danger: #dc3545;
}


/* PAGE */

.warning-page {

    width: 100%;

    max-width: 1100px;

    margin: auto;

    padding: 45px 35px 60px;
}


/* HEADER */

.warning-header {

    margin-bottom: 28px;
}

.warning-label {

    color: var(--navy-light);

    font-size: 12px;

    font-weight: 800;

    letter-spacing: 1.4px;

    margin-bottom: 8px;
}

.warning-title {

    margin: 0;

    color: var(--navy);

    font-size: 32px;

    font-weight: 800;
}

.warning-description {

    margin: 8px 0 0;

    color: var(--muted);

    font-size: 14px;
}


/* CARD */

.warning-card {

    background: white;

    border: 1px solid var(--border);

    border-radius: 18px;

    padding: 30px;

    box-shadow:
        0 8px 28px rgba(15,23,42,.05);
}


/* HEADING */

.form-heading {

    display: flex;

    align-items: center;

    gap: 12px;

    padding-bottom: 20px;

    margin-bottom: 25px;

    border-bottom: 1px solid #edf2f7;
}

.form-icon {

    width: 46px;

    height: 46px;

    border-radius: 12px;

    background: #eef4f8;

    color: var(--navy);

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 19px;
}

.form-heading h3 {

    margin: 0;

    color: var(--navy);

    font-size: 18px;

    font-weight: 800;
}


/* FORM */

.form-group {

    margin-bottom: 20px;
}

.form-label {

    display: block;

    margin-bottom: 8px;

    color: #334155;

    font-size: 12px;

    font-weight: 800;
}

.form-label span {

    color: var(--danger);
}

.form-control {

    width: 100%;

    box-sizing: border-box;

    padding: 13px 14px;

    border: 1px solid #dbe3eb;

    border-radius: 10px;

    color: var(--text);

    font-size: 13px;

    font-family: inherit;

    outline: none;
}

.form-control:focus {

    border-color: var(--navy-light);

    box-shadow:
        0 0 0 3px rgba(29,111,165,.10);
}

textarea.form-control {

    min-height: 145px;

    resize: vertical;

    line-height: 1.6;
}


/* ACTIONS */

.form-actions {

    display: flex;

    justify-content: flex-end;

    gap: 10px;

    padding-top: 20px;

    border-top: 1px solid #edf2f7;
}

.btn {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    gap: 7px;

    padding: 12px 20px;

    border-radius: 10px;

    font-size: 12px;

    font-weight: 800;

    text-decoration: none;

    border: none;

    cursor: pointer;
}

.btn-save {

    background: var(--navy);

    color: white;
}

.btn-save:hover {

    background: var(--navy-light);

    color: white;
}

.btn-cancel {

    background: #f8fafc;

    border: 1px solid var(--border);

    color: #475569;
}


/* FOOTER */

.warning-footer {

    margin-top: 35px;

    text-align: center;

    color: #94a3b8;

    font-size: 11px;
}


/* MOBILE */

@media(max-width:700px) {

    .warning-page {

        padding: 28px 15px 45px;
    }

    .warning-card {

        padding: 22px;
    }

    .warning-title {

        font-size: 27px;
    }

    .form-actions {

        flex-direction: column;
    }

    .btn {

        width: 100%;
    }
}

</style>


<div class="warning-page">


    <div class="warning-header">

        <div class="warning-label">

            <i class="bi bi-pencil-square"></i>

            DISASTER MANAGEMENT SYSTEM

        </div>

        <h1 class="warning-title">

            Edit Warning Alert

        </h1>

        <p class="warning-description">

            Update the early warning notification details.

        </p>

    </div>


    <div class="warning-card">


        <div class="form-heading">

            <div class="form-icon">

                <i class="bi bi-bell-fill"></i>

            </div>

            <div>

                <h3>

                    Warning Alert Details

                </h3>

            </div>

        </div>


        <form
            method="POST"
            action="/myapp/admin_edit_notification_post/">

            {% csrf_token %}


            <!-- TITLE -->

            <div class="form-group">

                <label class="form-label">

                    Alert Title <span>*</span>

                </label>

                <input
                    type="text"
                    name="title"
                    class="form-control"
                    value="{{ data.title }}"
                    maxlength="150"
                    required>

            </div>


            <!-- DATE -->

            <div class="form-group">

                <label class="form-label">

                    Alert Date <span>*</span>

                </label>

                <input
                    type="date"
                    name="date"
                    class="form-control"
                    value="{{ data.date|date:'Y-m-d' }}"
                    required>

            </div>


            <!-- DESCRIPTION -->

            <div class="form-group">

                <label class="form-label">

                    Alert Description <span>*</span>

                </label>

                <textarea
                    name="description"
                    class="form-control"
                    maxlength="300"
                    required>{{ data.description }}</textarea>

            </div>


            <!-- BUTTONS -->

            <div class="form-actions">

                <a
                    href="/myapp/admin_view_notifications/"
                    class="btn btn-cancel">

                    <i class="bi bi-arrow-left"></i>

                    Cancel

                </a>

                <button
                    type="submit"
                    class="btn btn-save">

                    <i class="bi bi-check-lg"></i>

                    Update Alert

                </button>

            </div>


        </form>

    </div>


    <div class="warning-footer">

        © 2026 DisasterSafe · Early Warning Management

    </div>


</div>

{% endblock %}
