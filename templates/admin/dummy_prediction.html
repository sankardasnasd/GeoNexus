<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>DisasterSafe | Test Prediction</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at top left,
                    rgba(239, 68, 68, 0.16),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(249, 115, 22, 0.12),
                    transparent 35%
                ),
                #0b0f14;

            color: #f1f5f9;

            font-family:
                Arial,
                sans-serif;
        }

        .container-box {

            max-width: 850px;

            margin: 60px auto;

            padding: 35px;

            background: rgba(18, 23, 30, .92);

            border: 1px solid rgba(255,255,255,.08);

            border-radius: 18px;

            box-shadow:
                0 20px 50px
                rgba(0,0,0,.4);
        }

        .title {

            font-size: 30px;

            font-weight: 700;

            margin-bottom: 8px;
        }

        .subtitle {

            color: #9ca7b3;

            margin-bottom: 30px;
        }

        label {

            color: #cbd5e1;

            font-weight: 600;

            margin-bottom: 7px;
        }

        input {

            background: #12171e !important;

            border: 1px solid
                rgba(255,255,255,.1) !important;

            color: white !important;

            padding: 12px !important;
        }

        input:focus {

            box-shadow: none !important;

            border-color: #ef4444 !important;
        }

        .btn-danger-custom {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            color: white;

            font-size: 16px;

            font-weight: 700;

            background:
                linear-gradient(
                    135deg,
                    #ef4444,
                    #dc2626
                );
        }

        .btn-danger-custom:hover {

            opacity: .9;
        }

        .info {

            margin-top: 25px;

            padding: 18px;

            border-radius: 12px;

            background:
                rgba(239,68,68,.08);

            border:
                1px solid
                rgba(239,68,68,.2);
        }

        .info strong {

            color: #ef4444;
        }

    </style>

</head>

<body>

<div class="container-box">

    <div class="title">
        Disaster Prediction Test
    </div>

    <div class="subtitle">
        Test disaster prediction and database notification saving.
    </div>

    <form
        method="POST"
        action="{% url 'dummy_disaster_prediction' %}"
    >

        {% csrf_token %}

        <div class="row g-3">

            <div class="col-md-6">

                <label>
                    Latitude
                </label>

                <input
                    type="number"
                    step="any"
                    name="lat"
                    class="form-control"
                    value="11.2588"
                    required
                >

            </div>

            <div class="col-md-6">

                <label>
                    Longitude
                </label>

                <input
                    type="number"
                    step="any"
                    name="lon"
                    class="form-control"
                    value="75.7804"
                    required
                >

            </div>

            <div class="col-md-6">

                <label>
                    Place
                </label>

                <input
                    type="text"
                    name="place"
                    class="form-control"
                    value="Kozhikode"
                    required
                >

            </div>

            <div class="col-md-6">

                <label>
                    District
                </label>

                <input
                    type="text"
                    name="district"
                    class="form-control"
                    value="Kozhikode"
                    required
                >

            </div>

        </div>

        <div class="info">

            <strong>Dummy Disaster Values</strong>

            <br><br>

            Rainfall: 145.5 mm

            <br>

            Humidity: 94%

            <br>

            River Distance: 0.45 km

            <br>

            Slope: 28°

            <br>

            Soil: Laterite Soil

            <br>

            Temperature: 26°C

            <br><br>

            These values are used only for testing.

        </div>

        <br>

        <button
            type="submit"
            class="btn-danger-custom"
        >

            TEST DISASTER PREDICTION

        </button>

    </form>

</div>

</body>

</html>
