{% if messages %}
<style>
    .ds-messages { margin-top: 18px; }

    .ds-alert {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 12px 14px;
        margin-bottom: 10px;
        border-radius: 9px;
        font-size: 11px;
        line-height: 1.5;
        background: rgba(239,68,68,0.10);
        border: 1px solid rgba(239,68,68,0.25);
        color: #f87171;
    }

    .ds-alert i { font-size: 14px; margin-top: 1px; }
    .ds-alert .ds-text { flex: 1; }

    .ds-alert.success, .ds-alert.info {
        background: rgba(34,197,94,0.08);
        border-color: rgba(34,197,94,0.20);
        color: #4ade80;
    }

    .ds-alert.warning {
        background: rgba(249,115,22,0.10);
        border-color: rgba(249,115,22,0.25);
        color: #fb923c;
    }

    .ds-alert .ds-close {
        background: transparent;
        border: none;
        color: inherit;
        opacity: .6;
        cursor: pointer;
        font-size: 14px;
        padding: 0;
        line-height: 1;
    }
    .ds-alert .ds-close:hover { opacity: 1; }
</style>

<div class="ds-messages">
    {% for message in messages %}
    <div class="ds-alert {% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}" role="alert">
        <i class="bi
            {% if message.tags == 'success' %}bi-check-circle-fill
            {% elif message.tags == 'warning' %}bi-exclamation-triangle-fill
            {% elif message.tags == 'info' %}bi-info-circle-fill
            {% else %}bi-x-octagon-fill{% endif %}"></i>
        <div class="ds-text">{{ message }}</div>
        <button type="button" class="ds-close" aria-label="Close"
                onclick="this.parentElement.remove()">
            <i class="bi bi-x-lg"></i>
        </button>
    </div>
    {% endfor %}
</div>
{% endif %}
